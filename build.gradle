// Top-level build file where you can add configuration options common to all sub-projects/modules.

buildscript {
    // AGP 9.x ships built-in Kotlin support; the Kotlin Gradle plugin only needs to be on the
    // build classpath (it is no longer applied to the app module). Keep it in sync with AGP.
    ext.kotlin_version = '2.2.21'
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        // AGP 9.4 is the first plugin release that supports compileSdk 37 (Android 17).
        classpath 'com.android.tools.build:gradle:9.4.0'
        classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlin_version"

        // NOTE: Do not place your application dependencies here; they belong
        // in the individual module build.gradle files
    }
}

allprojects {
    repositories {
        google()
        mavenCentral()
        maven { url = "https://jitpack.io" }
    }
}

tasks.register('clean', Delete) {
    delete(rootProject.layout.buildDirectory)
}
