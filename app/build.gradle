// AGP 9.x provides built-in Kotlin support, so the "kotlin-android" plugin must not be applied
// here any more. "kotlin-kapt" was unused (no annotation processors) and has been dropped.
apply plugin: 'com.android.application'

// Load keystore
def keystorePropertiesFile = rootProject.file("keystore.properties")
def keystoreProperties = new Properties()
keystoreProperties.load(new FileInputStream(keystorePropertiesFile))

/*
 * Versioning
 *
 * version.properties holds VERSION_MAJOR/MINOR/PATCH (the user-visible versionName) and
 * VERSION_BUILD, which is bumped automatically for every release build. The build number is
 * incremented by IncrementVersionBuildTask, and the release variant's versionCode is wired to
 * that task's output (see androidComponents below), so:
 *   - debug builds never touch version.properties,
 *   - any build that produces a release artifact (assembleRelease, bundleRelease, installRelease)
 *     increments the build number and packages the incremented value in the same build,
 *   - the task runs on every release build (it is never skipped as up-to-date or restored
 *     from the build cache).
 */
abstract class IncrementVersionBuildTask extends DefaultTask {
    /** version.properties; read and rewritten with VERSION_BUILD + 1 */
    @OutputFile
    abstract RegularFileProperty getVersionFile()

    /** Receives the computed versionCode, consumed by the release variant */
    @OutputFile
    abstract RegularFileProperty getVersionCodeFile()

    IncrementVersionBuildTask() {
        // Side-effecting by design: increments on every execution
        doNotTrackState("Increments the build number on every release build")
    }

    static Properties loadVersion(File file) {
        def props = new Properties()
        file.withInputStream { props.load(it) }
        return props
    }

    static int versionCodeOf(Properties props) {
        return props['VERSION_MAJOR'].toInteger() * 1000000 +
                props['VERSION_MINOR'].toInteger() * 10000 +
                props['VERSION_PATCH'].toInteger() * 100 +
                props['VERSION_BUILD'].toInteger()
    }

    static String versionNameOf(Properties props) {
        return "${props['VERSION_MAJOR']}.${props['VERSION_MINOR']}.${props['VERSION_PATCH']}"
    }

    @TaskAction
    void increment() {
        def file = versionFile.get().asFile
        def props = loadVersion(file)
        props['VERSION_BUILD'] = (props['VERSION_BUILD'].toInteger() + 1).toString()
        file.withWriter { props.store(it, null) }

        def code = versionCodeOf(props)
        versionCodeFile.get().asFile.text = code.toString()
        logger.lifecycle("Release build number incremented: VERSION_BUILD=${props['VERSION_BUILD']} (versionCode ${code})")
    }
}

def versionPropsFile = file('version.properties')
def versionProps = IncrementVersionBuildTask.loadVersion(versionPropsFile)

android {
    namespace = 'com.gigabytedevelopersinc.app.cometOTP'

    // Android 17 (API 37). Keep compileSdk and targetSdk in lock-step: targeting the latest
    // platform disables the compatibility modes the OS would otherwise apply to the app.
    compileSdk = 37

    defaultConfig {
        applicationId = "com.gigabytedevelopersinc.app.CometOTP"
        // Android 6.0: current AndroidX/Material releases no longer support API 22.
        minSdk = 23
        targetSdk = 37
        // Values as currently stored; the release variant overrides versionCode with the
        // incremented value (see androidComponents below).
        versionCode = IncrementVersionBuildTask.versionCodeOf(versionProps)
        versionName = IncrementVersionBuildTask.versionNameOf(versionProps)
        testInstrumentationRunner = "androidx.test.runner.AndroidJUnitRunner"
        vectorDrawables.useSupportLibrary = true
        multiDexEnabled = true
    }

    signingConfigs {
        release {
            storeFile = file(keystoreProperties['storeFile'])
            storePassword = keystoreProperties['storePassword']
            keyAlias = keystoreProperties['keyAlias']
            keyPassword = keystoreProperties['keyPassword']
        }
    }

    // Pass -PminifyDebug to build a shrunk debug APK for testing the R8 keep rules on the ".dev"
    // package without touching the production install (R8 shrinks but does not rename classes in
    // debuggable builds, so only release builds are obfuscated).
    def minifyDebug = project.hasProperty('minifyDebug')

    buildTypes {
        release {
            signingConfig = signingConfigs.release
            // Google Play's "App optimization" check requires code shrinking, obfuscation and
            // resource shrinking. The mapping file is bundled automatically for crash de-obfuscation.
            minifyEnabled = true
            shrinkResources = true
            proguardFiles(getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro')
        }
        debug {
            applicationIdSuffix = ".dev"
            versionNameSuffix = "-dev"
            enableUnitTestCoverage = !minifyDebug
            enableAndroidTestCoverage = !minifyDebug
            minifyEnabled = minifyDebug
            shrinkResources = minifyDebug
            proguardFiles(getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro')
        }
    }

    compileOptions {
        // Flag to enable support for the new language APIs
        coreLibraryDesugaringEnabled = true

        // Sets Java compatibility to Java 17
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }

    kotlin {
        compilerOptions {
            jvmTarget = org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_17
        }
    }

    lint {
        abortOnError = false
        checkReleaseBuilds = false
        disable += ['MissingTranslation', 'ExtraTranslation']
    }
}

def incrementVersionBuild = tasks.register('incrementVersionBuild', IncrementVersionBuildTask) {
    group = 'versioning'
    description = 'Increments VERSION_BUILD in version.properties (runs automatically for release builds).'
    versionFile = versionPropsFile
    versionCodeFile = layout.buildDirectory.file('version/release-version-code.txt')
}

androidComponents {
    // Release builds: versionCode comes from the increment task, which makes every release
    // artifact depend on it (and only release artifacts).
    onVariants(selector().withBuildType('release')) { variant ->
        def incrementedVersionCode = incrementVersionBuild
                .flatMap { it.versionCodeFile }
                .map { it.asFile.text.trim().toInteger() }
        variant.outputs.each { output ->
            output.versionCode.set(incrementedVersionCode)
        }
    }

    // Name the APKs "CometOTP-<variant>-<versionName>.apk" (new Variant API; the legacy
    // applicationVariants API was removed in AGP 9).
    onVariants(selector().all()) { variant ->
        variant.outputs.each { output ->
            output.outputFileName.set(output.versionName.map { name ->
                "CometOTP-${variant.name}-${name}.apk".toString()
            })
        }
    }
}

tasks.withType(JavaCompile).configureEach {
    options.compilerArgs << "-Xlint:unchecked" << "-Xlint:deprecation"
}

dependencies {
    // AndroidX Core
    implementation 'androidx.appcompat:appcompat:1.8.0'
    implementation 'androidx.appcompat:appcompat-resources:1.8.0'
    implementation 'androidx.core:core-ktx:1.19.0'
    implementation 'androidx.documentfile:documentfile:1.1.0'   // used directly by BackupHelper (no longer transitive)
    implementation "androidx.cardview:cardview:1.0.0"

    // UI & Layout
    implementation 'androidx.constraintlayout:constraintlayout:2.2.2'
    implementation 'androidx.recyclerview:recyclerview:1.4.0'
    implementation 'com.google.android.material:material:1.14.0'
    implementation 'androidx.browser:browser:1.10.0'
    implementation "com.leinardi.android:speed-dial:3.3.0"
    implementation "me.zhanghai.android.materialprogressbar:library:1.6.1"
    implementation 'me.zhanghai.android.fastscroll:library:1.3.0'

    // Lifecycle
    def lifecycle_version = "2.11.0"
    implementation "androidx.lifecycle:lifecycle-process:$lifecycle_version"
    implementation "androidx.lifecycle:lifecycle-common-java8:$lifecycle_version"

    // Utilities
    implementation 'commons-codec:commons-codec:1.22.1'
    implementation "com.journeyapps:zxing-android-embedded:4.3.0"
    implementation "com.github.open-keychain.open-keychain:openpgp-api:v5.7.1"
    implementation 'de.peilicke.sascha:android-customtabs:3.1.1'
    implementation fileTree(dir: 'libs', include: ['*.jar'])

    // Testing
    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test:runner:1.7.0'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.7.0'

    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.1.5'
}
configurations {
    implementation.exclude group: "com.android.support", module: "customtabs"
}
