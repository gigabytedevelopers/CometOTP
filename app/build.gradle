import org.jetbrains.kotlin.gradle.dsl.JvmTarget

import java.time.Duration
import java.time.Instant

// AGP 9.x provides built-in Kotlin support, so the "kotlin-android" plugin must not be applied
// here any more. "kotlin-kapt" was unused (no annotation processors) and has been dropped.
apply plugin: 'com.android.application'

/*
 * Signing
 *
 * Locally the four values come from keystore.properties, which is not in the repository. On CI
 * they arrive as environment variables written from repository secrets. A checkout with neither
 * still configures and builds; only the release signing config is left off, which is all the
 * pull-request checks need and stops a fork from failing on a file it cannot have.
 */
def keystorePropertiesFile = rootProject.file("keystore.properties")
def keystoreProperties = new Properties()

if (keystorePropertiesFile.exists()) {
    keystorePropertiesFile.withInputStream { keystoreProperties.load(it) }
} else if (System.getenv("ANDROID_KEYSTORE_FILE")) {
    keystoreProperties["storeFile"] = System.getenv("ANDROID_KEYSTORE_FILE")
    keystoreProperties["storePassword"] = System.getenv("ANDROID_KEYSTORE_PASSWORD")
    keystoreProperties["keyAlias"] = System.getenv("ANDROID_KEY_ALIAS")
    keystoreProperties["keyPassword"] = System.getenv("ANDROID_KEY_PASSWORD")
}

def canSignRelease = keystoreProperties["storeFile"] != null

/*
 * Versioning
 *
 * version.properties holds VERSION_MAJOR/MINOR/PATCH, the user-visible versionName, and nothing
 * else: builds never write to it.
 *
 * The release versionCode is the time of the build, counted in minutes, on top of a base:
 *
 *   versionCode = BASE + minutes since EPOCH (UTC)
 *
 * Nothing is stored, so there is no counter to fall out of step. The old scheme kept a build
 * number in version.properties that the release workflow had to hand back to master through a
 * pull request, and every time that pull request went unmerged the next release rebuilt the same
 * code and Play rejected it. Here a later build always gets a higher code, whoever builds it and
 * whatever state the repository is in, and the only way two builds share one is to start in the
 * same minute (the release workflow's concurrency group already rules that out for CI).
 *
 * BASE sits above every code the old MAJOR*1000000 + MINOR*10000 + PATCH*100 + BUILD scheme could
 * produce for any version below 10.0.0 (8000007 is the highest ever uploaded), so the first new
 * code is higher than anything already on Play. At one code per minute, Play's 2100000000 ceiling
 * is about 3,970 years away.
 *
 * Debug builds use BASE unchanged. They install as a separate ".dev" app and are never uploaded,
 * so a fixed code keeps them reproducible while still being higher than the old debug codes, which
 * lets `adb install -r` upgrade an existing .dev install.
 */
abstract class VersionCodeTask extends DefaultTask {
    static final int BASE = 10_000_000
    static final Instant EPOCH = Instant.parse('2026-01-01T00:00:00Z')
    static final int PLAY_MAX = 2_100_000_000

    /** Receives the computed versionCode, consumed by the release variant */
    @OutputFile
    abstract RegularFileProperty getVersionCodeFile()

    VersionCodeTask() {
        // The code depends on the clock, so it must be worked out afresh on every release build.
        doNotTrackState("The versionCode is the time of the build")
    }

    static Properties loadVersion(File file) {
        def props = new Properties()
        file.withInputStream { props.load(it) }
        return props
    }

    static String versionNameOf(Properties props) {
        return "${props['VERSION_MAJOR']}.${props['VERSION_MINOR']}.${props['VERSION_PATCH']}"
    }

    static int versionCodeAt(Instant now) {
        long minutes = Duration.between(EPOCH, now).toMinutes()
        if (minutes < 0)
            throw new GradleException("The clock reads $now, before the versionCode epoch $EPOCH. Fix the system time.")
        long code = BASE + minutes
        if (code > PLAY_MAX)
            throw new GradleException("versionCode $code is above Play's limit of $PLAY_MAX.")
        return (int) code
    }

    @TaskAction
    void stamp() {
        def code = versionCodeAt(Instant.now())
        versionCodeFile.get().asFile.text = code.toString()
        logger.lifecycle("Release versionCode $code")
    }
}

def versionProps = VersionCodeTask.loadVersion(file('version.properties'))

android {
    namespace = 'com.gigabytedevelopersinc.app.cometOTP'

    // Android 17 (API 37). Keep compileSdk and targetSdk in lock-step: targeting the latest
    // platform disables the compatibility modes the OS would otherwise apply to the app.
    compileSdk = 37

    defaultConfig {
        applicationId = "com.gigabytedevelopersinc.app.CometOTP"
        // Android 6.0: current AndroidX/Material releases no longer support API 22.
        minSdk = 23
        targetSdk = 37
        // The fixed code debug builds use; the release variant overrides it with the time of the
        // build (see androidComponents below).
        versionCode = VersionCodeTask.BASE
        versionName = VersionCodeTask.versionNameOf(versionProps)
        testInstrumentationRunner = "androidx.test.runner.AndroidJUnitRunner"
        vectorDrawables.useSupportLibrary = true
        multiDexEnabled = true
    }

    signingConfigs {
        release {
            if (canSignRelease) {
                storeFile = file(keystoreProperties['storeFile'])
                storePassword = keystoreProperties['storePassword']
                keyAlias = keystoreProperties['keyAlias']
                keyPassword = keystoreProperties['keyPassword']
            }
        }
    }

    // Pass -PminifyDebug to build a shrunk debug APK for testing the R8 keep rules on the ".dev"
    // package without touching the production install (R8 shrinks but does not rename classes in
    // debuggable builds, so only release builds are obfuscated).
    def minifyDebug = project.hasProperty('minifyDebug')

    buildTypes {
        release {
            // Left unsigned when no keystore is available, so the build still configures.
            if (canSignRelease)
                signingConfig = signingConfigs.release
            // Google Play's "App optimization" check requires code shrinking, obfuscation and
            // resource shrinking. The mapping file is bundled automatically for crash de-obfuscation.
            minifyEnabled = true
            shrinkResources = true
            proguardFiles(getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro')
        }
        debug {
            applicationIdSuffix = ".dev"
            versionNameSuffix = "-dev"
            enableUnitTestCoverage = !minifyDebug
            enableAndroidTestCoverage = !minifyDebug
            minifyEnabled = minifyDebug
            shrinkResources = minifyDebug
            proguardFiles(getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro')
        }
    }

    compileOptions {
        // Flag to enable support for the new language APIs
        coreLibraryDesugaringEnabled = true

        // Sets Java compatibility to Java 17
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }

    kotlin {
        compilerOptions {
            jvmTarget = JvmTarget.JVM_17
        }
    }

    lint {
        abortOnError = false
        checkReleaseBuilds = false
        disable += ['MissingTranslation', 'ExtraTranslation']
    }
}

def stampVersionCode = tasks.register('stampVersionCode', VersionCodeTask) {
    group = 'versioning'
    description = 'Works out the release versionCode from the time of the build (runs automatically for release builds).'
    versionCodeFile = layout.buildDirectory.file('version/release-version-code.txt')
}

androidComponents {
    // Release builds: versionCode comes from the stamp task, which makes every release artifact
    // depend on it (and only release artifacts).
    onVariants(selector().withBuildType('release')) { variant ->
        def stampedVersionCode = stampVersionCode
                .flatMap { it.versionCodeFile }
                .map { it.asFile.text.trim().toInteger() }
        variant.outputs.each { output ->
            output.versionCode.set(stampedVersionCode)
        }
    }

    // Name the APKs "CometOTP-<variant>-<versionName>.apk" (new Variant API; the legacy
    // applicationVariants API was removed in AGP 9).
    onVariants(selector().all()) { variant ->
        variant.outputs.each { output ->
            output.outputFileName.set(output.versionName.map { name ->
                "CometOTP-${variant.name}-${name}.apk".toString()
            })
        }
    }
}

tasks.withType(JavaCompile).configureEach {
    options.compilerArgs << "-Xlint:unchecked" << "-Xlint:deprecation"
}

dependencies {
    // AndroidX Core
    implementation 'androidx.appcompat:appcompat:1.8.0'
    implementation 'androidx.appcompat:appcompat-resources:1.8.0'
    implementation 'androidx.core:core-ktx:1.19.0'
    implementation 'androidx.core:core-splashscreen:1.2.0'
    implementation 'androidx.documentfile:documentfile:1.1.0'   // used directly by BackupHelper (no longer transitive)
    implementation "androidx.cardview:cardview:1.0.0"
    implementation "androidx.biometric:biometric:1.1.0"

    // UI & Layout
    implementation 'androidx.constraintlayout:constraintlayout:2.2.2'
    implementation 'androidx.recyclerview:recyclerview:1.4.0'
    implementation 'com.google.android.material:material:1.14.0'
    implementation 'androidx.browser:browser:1.10.0'
    implementation "me.zhanghai.android.materialprogressbar:library:1.6.1"
    implementation 'me.zhanghai.android.fastscroll:library:1.3.0'

    // Lifecycle
    def lifecycle_version = "2.11.0"
    implementation "androidx.lifecycle:lifecycle-process:$lifecycle_version"
    implementation "androidx.lifecycle:lifecycle-common-java8:$lifecycle_version"

    // Utilities
    implementation 'commons-codec:commons-codec:1.22.1'
    implementation "com.journeyapps:zxing-android-embedded:4.3.0"
    implementation "com.github.open-keychain.open-keychain:openpgp-api:v5.7.1"
    implementation 'de.peilicke.sascha:android-customtabs:3.1.1'
    implementation fileTree(dir: 'libs', include: ['*.jar'])

    // Testing
    testImplementation 'junit:junit:4.13.2'
    // android.jar only has throwing stubs for org.json; the JVM unit tests need the real thing
    testImplementation 'org.json:json:20260814'
    androidTestImplementation 'androidx.test:runner:1.7.0'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.7.0'

    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.1.5'
}
configurations {
    implementation.exclude group: "com.android.support", module: "customtabs"
}
