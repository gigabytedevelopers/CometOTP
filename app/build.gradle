// AGP 9.x provides built-in Kotlin support, so the "kotlin-android" plugin must not be applied
// here any more. "kotlin-kapt" was unused (no annotation processors) and has been dropped.
apply plugin: 'com.android.application'

// Load keystore
def keystorePropertiesFile = rootProject.file("keystore.properties")
def keystoreProperties = new Properties()
keystoreProperties.load(new FileInputStream(keystorePropertiesFile))

def versionPropsFile = file('version.properties')
def versionProps = new Properties()
versionProps.load(new FileInputStream(versionPropsFile))

def versionMajor = versionProps['VERSION_MAJOR'].toInteger()
def versionMinor = versionProps['VERSION_MINOR'].toInteger()
def versionPatch = versionProps['VERSION_PATCH'].toInteger()
def versionBuild = versionProps['VERSION_BUILD'].toInteger()

android {
    namespace = 'com.gigabytedevelopersinc.app.cometOTP'

    // Android 17 (API 37). Keep compileSdk and targetSdk in lock-step: targeting the latest
    // platform disables the compatibility modes the OS would otherwise apply to the app.
    compileSdk = 37

    defaultConfig {
        applicationId = "com.gigabytedevelopersinc.app.CometOTP"
        // Android 6.0: current AndroidX/Material releases no longer support API 22.
        minSdk = 23
        targetSdk = 37
        versionCode = versionMajor * 1000000 + versionMinor * 10000 + versionPatch * 100 + versionBuild
        versionName = "${versionMajor}.${versionMinor}.${versionPatch}"
        testInstrumentationRunner = "androidx.test.runner.AndroidJUnitRunner"
        vectorDrawables.useSupportLibrary = true
        multiDexEnabled = true
    }

    signingConfigs {
        release {
            storeFile = file(keystoreProperties['storeFile'])
            storePassword = keystoreProperties['storePassword']
            keyAlias = keystoreProperties['keyAlias']
            keyPassword = keystoreProperties['keyPassword']
        }
    }

    // Pass -PminifyDebug to build a shrunk debug APK for testing the R8 keep rules on the ".dev"
    // package without touching the production install (R8 shrinks but does not rename classes in
    // debuggable builds, so only release builds are obfuscated).
    def minifyDebug = project.hasProperty('minifyDebug')

    buildTypes {
        release {
            signingConfig = signingConfigs.release
            // Google Play's "App optimization" check requires code shrinking, obfuscation and
            // resource shrinking. The mapping file is bundled automatically for crash de-obfuscation.
            minifyEnabled = true
            shrinkResources = true
            proguardFiles(getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro')
        }
        debug {
            applicationIdSuffix = ".dev"
            versionNameSuffix = "-dev"
            enableUnitTestCoverage = !minifyDebug
            enableAndroidTestCoverage = !minifyDebug
            minifyEnabled = minifyDebug
            shrinkResources = minifyDebug
            proguardFiles(getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro')
        }
    }

    compileOptions {
        // Flag to enable support for the new language APIs
        coreLibraryDesugaringEnabled = true

        // Sets Java compatibility to Java 17
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }

    kotlin {
        compilerOptions {
            jvmTarget = org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_17
        }
    }

    lint {
        abortOnError = false
        checkReleaseBuilds = false
        disable += ['MissingTranslation', 'ExtraTranslation']
    }
}

// Name the APKs "CometOTP-<variant>-<versionName>.apk" using the new Variant API
// (the legacy applicationVariants API was removed in AGP 9).
androidComponents {
    onVariants(selector().all()) { variant ->
        variant.outputs.each { output ->
            output.outputFileName.set(output.versionName.map { name ->
                "CometOTP-${variant.name}-${name}.apk".toString()
            })
        }
    }
}

tasks.withType(JavaCompile).configureEach {
    options.compilerArgs << "-Xlint:unchecked" << "-Xlint:deprecation"
}

tasks.register('incrementVersionBuild') {
    def propsFile = versionPropsFile
    doLast {
        def props = new Properties()
        props.load(new FileInputStream(propsFile))

        def newVersionBuild = props['VERSION_BUILD'].toInteger() + 1
        props['VERSION_BUILD'] = newVersionBuild.toString()
        props.store(propsFile.newWriter(), null)
    }
}

afterEvaluate {
    tasks.named('assembleRelease').configure {
        dependsOn 'incrementVersionBuild'
    }
    tasks.named('bundleRelease').configure {
        dependsOn 'incrementVersionBuild'
    }
    tasks.named('assembleDebug').configure {
        dependsOn 'incrementVersionBuild'
    }
}

dependencies {
    // AndroidX Core
    implementation 'androidx.appcompat:appcompat:1.8.0'
    implementation 'androidx.appcompat:appcompat-resources:1.8.0'
    implementation 'androidx.core:core-ktx:1.19.0'
    implementation 'androidx.documentfile:documentfile:1.1.0'   // used directly by BackupHelper (no longer transitive)
    implementation "androidx.cardview:cardview:1.0.0"

    // UI & Layout
    implementation 'androidx.constraintlayout:constraintlayout:2.2.2'
    implementation 'androidx.recyclerview:recyclerview:1.4.0'
    implementation 'com.google.android.material:material:1.14.0'
    implementation 'androidx.browser:browser:1.10.0'
    implementation "com.leinardi.android:speed-dial:3.3.0"
    implementation "me.zhanghai.android.materialprogressbar:library:1.6.1"
    implementation 'me.zhanghai.android.fastscroll:library:1.3.0'

    // Lifecycle
    def lifecycle_version = "2.11.0"
    implementation "androidx.lifecycle:lifecycle-process:$lifecycle_version"
    implementation "androidx.lifecycle:lifecycle-common-java8:$lifecycle_version"

    // Utilities
    implementation 'commons-codec:commons-codec:1.22.1'
    implementation "com.journeyapps:zxing-android-embedded:4.3.0"
    implementation "com.github.open-keychain.open-keychain:openpgp-api:v5.7.1"
    implementation 'de.peilicke.sascha:android-customtabs:3.1.1'
    implementation fileTree(dir: 'libs', include: ['*.jar'])

    // Testing
    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test:runner:1.7.0'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.7.0'

    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.1.5'
}
configurations {
    implementation.exclude group: "com.android.support", module: "customtabs"
}
