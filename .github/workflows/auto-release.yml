name: Auto release

# After successful master CI, sign the new version tag with enwokoma's registered SSH key
# and push it using enwokoma's token. That push starts both release workflows as enwokoma.
# Do not also dispatch them: that would publish twice. Missing credentials never fall back to a bot.
# A fork/PR CI run cannot reach this job; its privileged code comes from the tested master commit.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [master]

permissions:
  contents: read

concurrency:
  # One at a time, so two quick merges cannot both decide the same version is new.
  group: auto-release
  cancel-in-progress: false

jobs:
  release:
    name: Sign and push the release tag
    # Only a passing CI run for a push to master in this repository. The branch filter alone would
    # also match a pull request from a fork whose own branch is called master.
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10

    env:
      SHA: ${{ github.event.workflow_run.head_sha }}

    steps:
      # The commit CI tested, not whatever master has moved on to since.
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0   # all the tags, to compare against
          persist-credentials: false

      - name: Work out whether this version is new
        id: version
        run: |
          prop() { grep "^$1=" app/version.properties | cut -d= -f2 | tr -d '[:space:]'; }
          version="$(prop VERSION_MAJOR).$(prop VERSION_MINOR).$(prop VERSION_PATCH)"
          tag="v$version"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

          if git rev-parse -q --verify "refs/tags/$tag" >/dev/null; then
            echo "$tag is already released, so this commit is not a release. Nothing to do."
            echo "new=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # A version below one already released is a revert or a typo, never a release.
          latest=$(git tag -l 'v[0-9]*' | sort -V | tail -n1)
          if [ -n "$latest" ] && [ "$(printf '%s\n%s\n' "$latest" "$tag" | sort -V | tail -n1)" != "$tag" ]; then
            echo "::error::app/version.properties says $version, which is below the latest release $latest. Not releasing."
            exit 1
          fi

          echo "$tag is new; releasing $SHA."
          echo "new=true" >> "$GITHUB_OUTPUT"

      - name: Configure enwokoma's release identity
        if: steps.version.outputs.new == 'true'
        env:
          GH_TOKEN: ${{ secrets.RELEASE_OWNER_TOKEN }}
          RELEASE_SIGNING_KEY: ${{ secrets.RELEASE_SIGNING_KEY }}
          RELEASE_SIGNING_PASSPHRASE: ${{ secrets.RELEASE_SIGNING_PASSPHRASE }}
        run: bash .github/scripts/configure_release_identity.sh

      - name: Sign and push the tag
        id: tag
        if: steps.version.outputs.new == 'true'
        env:
          GH_TOKEN: ${{ secrets.RELEASE_OWNER_TOKEN }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          git tag -s "$TAG" "$SHA" -m "CometOTP ${TAG#v}"
          git verify-tag "$TAG"
          git push origin "refs/tags/$TAG"
          object=$(git rev-parse "$TAG")
          verified=$(gh api "repos/$GITHUB_REPOSITORY/git/tags/$object" --jq '.verification.verified')
          test "$verified" = true || { echo '::error::GitHub did not verify the release tag.'; exit 1; }

      # Once a pushed tag exists, retries skip it. Check the tag-triggered runs before retrying
      # a failed release manually, so a bookkeeping failure does not cause another upload.
      - name: Say how to recover if a release did not start
        if: failure() && steps.version.outputs.new == 'true'
        env:
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          if git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null; then
            echo "::error::$TAG exists. Check the Release Android/iOS runs triggered by its push before starting another release."
            echo "::error::Start it by hand: Actions -> Release Android (or iOS) -> Run workflow -> Use workflow from: Tags -> $TAG."
          fi

      - name: Summary
        if: always()
        env:
          TAG: ${{ steps.version.outputs.tag }}
          NEW: ${{ steps.version.outputs.new }}
        run: |
          if [ "$NEW" = true ] && [ "${{ steps.tag.outcome }}" = success ]; then
            echo "Signed **$TAG** as enwokoma and pushed it to start the release workflows." >> "$GITHUB_STEP_SUMMARY"
          elif [ "$NEW" = false ]; then
            echo "$TAG is already released; nothing to do." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Remove the Git signing key
        if: always()
        run: bash .github/scripts/cleanup_release_identity.sh
