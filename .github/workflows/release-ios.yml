name: Release iOS

# Disabled until there is an Apple Developer account and the project has an iOS target.
#
# Every job is gated on the repository variable IOS_DEPLOY_ENABLED. While that is anything other
# than "true" the workflow still appears in the Actions tab, reports a skipped run and touches
# nothing, so it can sit here without interfering with the Android release.
#
# To turn it on later:
#   1. Settings -> Secrets and variables -> Actions -> Variables: set IOS_DEPLOY_ENABLED to true
#   2. Add the secrets listed in .github/RELEASING.md to the `production-ios` environment
#   3. Configure IOS_BUNDLE_ID, IOS_SCHEME / IOS_PROJECT to match the real iOS target
# Tag pushes submit directly to App Review; Apple approval is required before public release.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      lane:
        description: What to do with the build
        type: choice
        default: appstore
        options: [testflight, appstore]

permissions:
  contents: read

concurrency:
  group: release-ios
  cancel-in-progress: false

env:
  IOS_SCHEME: ${{ vars.IOS_SCHEME || 'CometOTP' }}
  IOS_PROJECT: ${{ vars.IOS_PROJECT || 'iosApp/iosApp.xcodeproj' }}
  IOS_EXPORT_OPTIONS: ${{ vars.IOS_EXPORT_OPTIONS || 'iosApp/ExportOptions.plist' }}
  IOS_BUNDLE_ID: ${{ vars.IOS_BUNDLE_ID }}
  FASTLANE_SKIP_UPDATE_CHECK: 'true'
  FASTLANE_OPT_OUT_USAGE: 'true'

jobs:
  # A tiny always-running job so the workflow reports honestly instead of looking broken.
  gate:
    name: Check whether iOS deployment is enabled
    runs-on: ubuntu-latest
    outputs:
      enabled: ${{ steps.check.outputs.enabled }}
    steps:
      - id: check
        run: |
          if [ "${{ vars.IOS_DEPLOY_ENABLED }}" = "true" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
            echo "iOS deployment is enabled."
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::notice::iOS deployment is switched off. Set the IOS_DEPLOY_ENABLED variable to 'true' to enable it."
          fi

  release:
    name: Build and publish
    needs: gate
    if: needs.gate.outputs.enabled == 'true' && github.actor == 'enwokoma'
    runs-on: macos-latest
    timeout-minutes: 60

    environment:
      name: production-ios
      url: https://appstoreconnect.apple.com

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Verify enwokoma's token and signed release tag
        env:
          GH_TOKEN: ${{ secrets.RELEASE_OWNER_TOKEN }}
        run: bash .github/scripts/verify_release_tag.sh

      - name: Check the iOS target and release version
        run: |
          test -d "$IOS_PROJECT" || { echo "::error::Missing iOS project: $IOS_PROJECT. Add the iOS target before enabling deployment."; exit 1; }
          test -f "$IOS_EXPORT_OPTIONS" || { echo "::error::Missing export options: $IOS_EXPORT_OPTIONS."; exit 1; }
          test -n "$IOS_BUNDLE_ID" || { echo '::error::Set IOS_BUNDLE_ID to the App Store Connect bundle identifier.'; exit 1; }
          prop() { grep "^$1=" app/version.properties | cut -d= -f2 | tr -d '[:space:]'; }
          version="$(prop VERSION_MAJOR).$(prop VERSION_MINOR).$(prop VERSION_PATCH)"
          test "$GITHUB_REF_NAME" = "v$version" || { echo '::error::Release tag must match app/version.properties.'; exit 1; }
          echo "IOS_VERSION=$version" >> "$GITHUB_ENV"
          # Each workflow execution/retry has a distinct build number for this version.
          echo "IOS_BUILD_NUMBER=$GITHUB_RUN_NUMBER.$GITHUB_RUN_ATTEMPT" >> "$GITHUB_ENV"

      - name: Set up Ruby and Fastlane
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          bundler-cache: true

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Select Xcode
        run: sudo xcode-select -switch /Applications/Xcode.app

      # The signing material lives in a keychain created for this job and deleted with the runner,
      # and the App Store Connect key is written to the runner temp directory, never the workspace.
      - name: Install the signing certificate and profile
        env:
          CERTIFICATE_BASE64: ${{ secrets.IOS_CERTIFICATE_BASE64 }}
          CERTIFICATE_PASSWORD: ${{ secrets.IOS_CERTIFICATE_PASSWORD }}
          PROVISIONING_PROFILE_BASE64: ${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}
          KEYCHAIN_PASSWORD: ${{ secrets.IOS_KEYCHAIN_PASSWORD }}
        run: |
          certificate="$RUNNER_TEMP/certificate.p12"
          profile="$RUNNER_TEMP/profile.mobileprovision"
          keychain="$RUNNER_TEMP/signing.keychain-db"

          umask 077

          printf '%s' "$CERTIFICATE_BASE64" | base64 --decode > "$certificate"
          printf '%s' "$PROVISIONING_PROFILE_BASE64" | base64 --decode > "$profile"

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$keychain"
          security import "$certificate" -P "$CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k "$keychain"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -k "$KEYCHAIN_PASSWORD" "$keychain" >/dev/null
          security list-keychain -d user -s "$keychain"

          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          cp "$profile" ~/Library/MobileDevice/Provisioning\ Profiles/

      - name: Write the App Store Connect key
        env:
          APPSTORE_PRIVATE_KEY: ${{ secrets.APPSTORE_PRIVATE_KEY }}
          APPSTORE_KEY_ID: ${{ secrets.APPSTORE_KEY_ID }}
        run: |
          umask 077
          mkdir -p "$RUNNER_TEMP/private_keys"
          printf '%s' "$APPSTORE_PRIVATE_KEY" > "$RUNNER_TEMP/private_keys/AuthKey_${APPSTORE_KEY_ID}.p8"
          echo "APPSTORE_KEY_FILE=$RUNNER_TEMP/private_keys/AuthKey_${APPSTORE_KEY_ID}.p8" >> "$GITHUB_ENV"

      - name: Build the shared Kotlin framework
        run: ./gradlew --no-daemon :shared:assembleXCFramework

      - name: Archive
        run: |
          xcodebuild -project "$IOS_PROJECT" \
            -scheme "$IOS_SCHEME" \
            -configuration Release \
            -archivePath "$RUNNER_TEMP/CometOTP.xcarchive" \
            -destination 'generic/platform=iOS' \
            MARKETING_VERSION="$IOS_VERSION" \
            CURRENT_PROJECT_VERSION="$IOS_BUILD_NUMBER" \
            archive

      - name: Export the IPA
        run: |
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/CometOTP.xcarchive" \
            -exportOptionsPlist "$IOS_EXPORT_OPTIONS" \
            -exportPath "$RUNNER_TEMP/export"

      - name: Locate the exported IPA
        run: |
          shopt -s nullglob
          ipas=("$RUNNER_TEMP/export/"*.ipa)
          test "${#ipas[@]}" = 1 || { echo '::error::Expected exactly one exported IPA.'; exit 1; }
          echo "IOS_IPA_PATH=${ipas[0]}" >> "$GITHUB_ENV"

      - name: Publish to App Store or explicitly selected TestFlight
        env:
          APPSTORE_KEY_ID: ${{ secrets.APPSTORE_KEY_ID }}
          APPSTORE_ISSUER_ID: ${{ secrets.APPSTORE_ISSUER_ID }}
          RELEASE_LANE: ${{ inputs.lane || 'appstore' }}
        run: |
          case "$RELEASE_LANE" in
            appstore|testflight) bundle exec fastlane ios "$RELEASE_LANE" ;;
            *) echo '::error::Unknown iOS release lane.'; exit 1 ;;
          esac

      - name: Release submission summary
        env:
          RELEASE_LANE: ${{ inputs.lane || 'appstore' }}
        run: |
          if [ "$RELEASE_LANE" = appstore ]; then
            echo "Submitted **$IOS_VERSION** ($IOS_BUILD_NUMBER) to App Review. It releases automatically to all users after Apple approves it." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Uploaded **$IOS_VERSION** ($IOS_BUILD_NUMBER) to TestFlight; no App Store submission was requested." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Clean up the signing material
        if: always()
        run: |
          security delete-keychain "$RUNNER_TEMP/signing.keychain-db" || true
          rm -rf "$RUNNER_TEMP/private_keys" "$RUNNER_TEMP/certificate.p12" "$RUNNER_TEMP/profile.mobileprovision"
