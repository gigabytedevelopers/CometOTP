name: Release Android

# Builds a signed App Bundle, publishes it to Google Play, writes the release notes, and opens a
# pull request that adds the new section to CHANGELOG.md.
#
# Nothing here reads a secret until the `production` environment has released the job, so you can
# require your own approval on every deployment from Settings -> Environments.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      track:
        description: Play track to publish to
        type: choice
        default: internal
        options: [internal, alpha, beta, production]
      status:
        description: Release status on that track
        type: choice
        default: completed
        options: [completed, draft, inProgress]

permissions:
  contents: read

concurrency:
  # Never let two deployments of the same app race each other.
  group: release-android
  cancel-in-progress: false

env:
  GRADLE_OPTS: -Dorg.gradle.daemon=false -Dorg.gradle.jvmargs=-Xmx4g

jobs:
  release:
    name: Build and publish
    runs-on: ubuntu-latest
    timeout-minutes: 60

    # Put the deployment secrets on this environment, not on the repository, so they are only
    # readable by this job and only after any reviewer you configure has approved the run.
    environment:
      name: production
      url: https://play.google.com/store/apps/details?id=com.gigabytedevelopersinc.app.CometOTP

    permissions:
      contents: write        # create the GitHub release
      pull-requests: write   # open the changelog pull request

    steps:
      - uses: actions/checkout@v7
        with:
          # git-cliff needs the history and tags to work out what changed.
          fetch-depth: 0

      # The GitHub release is named after version.properties, not the tag, so a tag pushed before
      # the version was bumped would publish the old version under a new tag. Checked first so a
      # mismatch fails before anything is built or signed.
      - name: Check the tag matches version.properties
        if: github.ref_type == 'tag'
        run: |
          prop() { grep "^$1=" app/version.properties | cut -d= -f2 | tr -d '[:space:]'; }
          expected="v$(prop VERSION_MAJOR).$(prop VERSION_MINOR).$(prop VERSION_PATCH)"
          if [ "$GITHUB_REF_NAME" != "$expected" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match app/version.properties ($expected)."
            echo "::error::Bump the version on master and tag that commit, or delete the tag and push $expected."
            exit 1
          fi
          echo "Tag $GITHUB_REF_NAME matches app/version.properties."

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      # The keystore lives in the runner's temp directory, which is wiped when the job ends, and
      # never inside the workspace, so it cannot be picked up by an artifact upload.
      - name: Restore signing keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::ANDROID_KEYSTORE_BASE64 is not set on the production environment."
            exit 1
          fi
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.keystore"
          echo "ANDROID_KEYSTORE_FILE=$RUNNER_TEMP/release.keystore" >> "$GITHUB_ENV"

      - name: Build App Bundle
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew --no-daemon bundleRelease

      - name: Read the version that was built
        id: version
        run: |
          # The release build works out the versionCode from the clock and writes the code it
          # packaged; nothing in the repository changes.
          code=$(cat app/build/version/release-version-code.txt)
          name=$(grep '^VERSION_MAJOR' app/version.properties | cut -d= -f2).$(grep '^VERSION_MINOR' app/version.properties | cut -d= -f2).$(grep '^VERSION_PATCH' app/version.properties | cut -d= -f2)
          echo "code=$code" >> "$GITHUB_OUTPUT"
          echo "name=$name" >> "$GITHUB_OUTPUT"
          echo "Built $name (versionCode $code)"

      # The notes cover the commits since the previous release and nothing earlier. A run from a
      # tag is sitting on that tag, where --unreleased finds nothing at all (which is how 8.0.0
      # shipped with an empty "## Unreleased"), so it takes --current: everything up to this tag
      # since the one before. A manual run from a branch has no tag yet, so --unreleased is right
      # there, named after the version it is about to tag.
      - name: Work out which commits this release covers
        run: |
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            echo "CLIFF_RANGE=--current" >> "$GITHUB_ENV"
          else
            echo "CLIFF_RANGE=--unreleased --tag v${{ steps.version.outputs.name }}" >> "$GITHUB_ENV"
          fi

      - name: Generate release notes
        uses: orhun/git-cliff-action@v4
        id: notes
        with:
          config: cliff.toml
          args: ${{ env.CLIFF_RANGE }} --strip all
        env:
          OUTPUT: RELEASE_NOTES.md

      # git-cliff still writes the version heading when there are no entries, so the file is never
      # empty; what matters is whether it lists anything.
      - name: Fall back when there is nothing new to list
        run: |
          if ! grep -q '^- ' RELEASE_NOTES.md; then
            echo "CometOTP ${{ steps.version.outputs.name }}" > RELEASE_NOTES.md
            echo "" >> RELEASE_NOTES.md
            echo "See CHANGELOG.md for the full history." >> RELEASE_NOTES.md
          fi

      # upload-google-play reads files named whatsnew-<locale>, which is not the <versionCode>.txt
      # that fastlane's supply uses. Getting that wrong is silent: the bundle uploads and the
      # release simply arrives with no notes on it, which is what happened to 8.0.0.
      #
      # The hand-written notes are named after the version they describe. They used to live in one
      # default.txt that was used whenever it existed, so 8.1.0 went out with the 8.0.0 text; a
      # file named for its version cannot be picked up by the next one. Without one, git-cliff's
      # list is rewritten as plain text and cut at the last whole entry that fits.
      - name: Prepare the Play release notes
        env:
          VERSION: ${{ steps.version.outputs.name }}
        run: |
          src="fastlane/metadata/android/en-US/changelogs/$VERSION.txt"
          out="$RUNNER_TEMP/whatsnew"
          mkdir -p "$out"
          if [ -f "$src" ]; then
            # Play counts characters, not bytes, and refuses the whole upload over 500.
            chars=$(python3 -c 'import sys; print(len(open(sys.argv[1], encoding="utf-8").read().strip()))' "$src")
            if [ "$chars" -gt 500 ]; then
              echo "::error::$src is $chars characters; Play allows 500. Shorten it and run the release again."
              exit 1
            fi
            cp "$src" "$out/whatsnew-en-US"
            echo "Using the hand-written notes in $src."
          else
            echo "::warning::No hand-written Play notes at $src, so Play gets notes generated from the commits. Add that file before releasing to write your own."
            if ! python3 .github/scripts/play_notes.py RELEASE_NOTES.md "$out/whatsnew-en-US"; then
              echo "CometOTP $VERSION. See the full list of changes on GitHub." > "$out/whatsnew-en-US"
            fi
          fi
          echo "WHATSNEW_DIR=$out" >> "$GITHUB_ENV"
          echo "---- What's new ($(python3 -c 'import sys; print(len(open(sys.argv[1], encoding="utf-8").read().strip()))' "$out/whatsnew-en-US") characters):"
          cat "$out/whatsnew-en-US"

      # `tracks` replaced the deprecated `track` input and takes a comma-separated list; this passes
      # the one track. The fallback is not optional: a tag push has no inputs, and an empty `tracks`
      # makes the action publish straight to production.
      - name: Publish to Google Play
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: com.gigabytedevelopersinc.app.CometOTP
          releaseFiles: app/build/outputs/bundle/release/*.aab
          tracks: ${{ inputs.track || 'internal' }}
          status: ${{ inputs.status || 'completed' }}
          whatsNewDirectory: ${{ env.WHATSNEW_DIR }}
          mappingFile: app/build/outputs/mapping/release/mapping.txt

      - name: Create the GitHub release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: v${{ steps.version.outputs.name }}
          name: CometOTP ${{ steps.version.outputs.name }}
          body_path: RELEASE_NOTES.md
          files: app/build/outputs/bundle/release/*.aab
          draft: false

      # Everything from here on is bookkeeping: the app is already on Play, so the deployment has
      # happened. These steps carry continue-on-error so that a failure among them is reported as a
      # warning rather than marking the production deployment failed, which is what made a release
      # that shipped successfully show up red.

      # Generated into its own file, then inserted under the heading, so every earlier entry,
      # including the hand-written ones, is left exactly as it is.
      - name: Generate the new changelog section
        continue-on-error: true
        uses: orhun/git-cliff-action@v4
        with:
          config: cliff.toml
          args: ${{ env.CLIFF_RANGE }}
        env:
          OUTPUT: NEW_SECTION.md

      # A release runs from a tag, so the checkout is on a commit rather than a branch. Move onto
      # master before touching CHANGELOG.md: the pull request has to be built from the branch it
      # will merge into, or it would propose undoing whatever landed since the tag.
      - name: Move onto master for the changelog
        continue-on-error: true
        run: |
          git fetch origin master
          git checkout -B master origin/master

      - name: Add the new section to CHANGELOG.md
        continue-on-error: true
        run: python3 .github/scripts/insert_changelog.py CHANGELOG.md NEW_SECTION.md

      # A pull request opened with GITHUB_TOKEN does not run CI without someone approving it first,
      # and the required checks never report until then. A GitHub App's token has no such limit,
      # and its pull request is authored by the app, so you can approve it as code owner.
      #
      # Set up once: create a GitHub App with Contents and Pull requests read/write, install it on
      # this repository, then add its client ID as the RELEASE_BOT_CLIENT_ID variable and its
      # private key as the RELEASE_BOT_PRIVATE_KEY secret on the production environment. Until
      # then this step is skipped and the pull request falls back to GITHUB_TOKEN.
      - name: Get the release bot's token
        id: bot_token
        if: vars.RELEASE_BOT_CLIENT_ID != ''
        continue-on-error: true
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.RELEASE_BOT_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_BOT_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write

      - name: Say so if the changelog falls back to GITHUB_TOKEN
        if: steps.bot_token.outputs.token == ''
        run: |
          echo "::warning::No release bot token, so the changelog pull request is opened with GITHUB_TOKEN."
          echo "::warning::Its CI will wait for you to approve the run on the pull request. See the comment on the 'Get the release bot's token' step."

      # master is protected, so the changelog arrives as a pull request rather than a direct push.
      # sign-commits has the commit made through the API, so GitHub signs it as the bot, which the
      # ruleset's signed-commits rule requires; a plain git push from the runner is unsigned.
      # The chore: prefix keeps the commit, and the squash commit named after the title, out of the
      # next release's notes.
      - name: Open the changelog pull request
        id: changelog_pr
        continue-on-error: true
        uses: peter-evans/create-pull-request@v8
        with:
          token: ${{ steps.bot_token.outputs.token || github.token }}
          sign-commits: true
          branch: chore/changelog-${{ steps.version.outputs.name }}
          title: "chore: Add the ${{ steps.version.outputs.name }} changelog entry"
          body: |
            Generated by the Android release workflow after publishing
            ${{ steps.version.outputs.name }} (versionCode ${{ steps.version.outputs.code }}).
          commit-message: "chore: Add the ${{ steps.version.outputs.name }} changelog entry"
          base: master
          add-paths: CHANGELOG.md

      # Not silent: a swallowed failure that nobody sees is worse than a red tick.
      - name: Say so if the changelog was not opened
        if: steps.changelog_pr.outcome != 'success'
        run: |
          v="${{ steps.version.outputs.name }}"
          echo "::warning::$v published to Play, but the changelog pull request was not opened."
          echo "::warning::Add the $v entry to CHANGELOG.md by hand."

      - name: Remove the keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/release.keystore"
